apiVersion: apps/v1
kind: Deployment
metadata:
  name: flexo-collector
  labels:
    app: flexo-collector
spec:
  selector:
    matchLabels:
      app: flexo-collector
  template:
    metadata:
      labels:
        app: flexo-collector
    spec:
      containers:
      - name: flexo-collector
        image: flexo-collector
        args:
          - --config=/etc/otel/collector-config.yaml
        volumeMounts:
          - name: config
            mountPath: /etc/otel
        ports:
        - containerPort: 4317
        - containerPort: 4318
      volumes:
        - name: config
          configMap:
            name: flexo-collector-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flexo-collector-config
data:
  collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:

    exporters:
      debug:
        verbosity: detailed

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
